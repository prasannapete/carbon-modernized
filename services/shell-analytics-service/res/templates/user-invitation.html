<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Invitation</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);">
                <tr>
                    <td align="center" style="padding:28px 24px 8px 24px;">
                        <img th:src="${logoUrl}" alt="Logo" height="48" style="height:48px;"/>
                    </td>
                </tr>
                <tr>
                    <td style="padding:8px 32px 0 32px;color:#1a1a1a;font-size:18px;font-weight:600;">
                        Hello <span th:text="${userFullName}">there</span>,
                    </td>
                </tr>
                <tr>
                    <td style="padding:12px 32px 0 32px;color:#444;font-size:15px;line-height:1.5;">
                        <span th:text="${invitationMessage}">You have been invited.</span>
                        Please set your password to activate your account.
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:24px 32px;">
                        <a th:href="${resetPasswordURL}"
                           style="display:inline-block;background-color:#2563eb;color:#ffffff;text-decoration:none;
                                  padding:12px 24px;border-radius:6px;font-size:15px;font-weight:600;">
                            Set your password
                        </a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 32px 8px 32px;color:#888;font-size:12px;line-height:1.5;">
                        If the button does not work, copy and paste this link into your browser:
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 32px 24px 32px;font-size:12px;word-break:break-all;">
                        <a th:href="${resetPasswordURL}" th:text="${resetPasswordURL}"
                           style="color:#2563eb;">link</a>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px;background-color:#f4f6f8;color:#aaa;font-size:11px;">
                        This is an automated message from Carbon. If you did not expect this invitation, you can ignore this email.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>

server:
  # Dedicated port for shell-analytics (9201 is the auth server, 9202 is common-service).
  # Override with SERVER_PORT if needed.
  port: ${SERVER_PORT:9203}
  forward-headers-strategy: NATIVE
  servlet:
    session:
      cookie:
        name: ${AUTH_SESSION_NAME:SRLSESSION}
spring:
  config:
    # Load the project-root .env (kept out of git) as a property source so ${DB_HOST},
    # ${DB_PORT}, ${DB_NAME}, ${DB_USER}, ${DB_PASSWORD} etc. resolve. Both paths are
    # optional: ./ when run from the repo root (IntelliJ), ../../ when run from this
    # module dir (mvn spring-boot:run).
    import:
      - optional:file:./.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  mail:
    # SMTP settings for the JavaMailSender bean that SMTPMailClient requires.
    # All values come from the project-root .env (kept out of git).
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Provides the JwtDecoder bean that SecurityConfig's oauth2ResourceServer().jwt()
          # requires, from the auth server's JWKS endpoint (as in common-service).
          jwk-set-uri: ${JWK_SET_URI:http://localhost:9201/oauth2/jwks}
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: postgresql
  application:
    name: carbon-shell-analytics-service
  thymeleaf:
    prefix: ${AUTH_RES_TEMPLATE_PATH:file:///@project.basedir@/res/templates/}
    cache: false
  web:
    resources:
      static-locations: ${AUTH_RES_STATIC_PATH:file:///@project.basedir@/res/static/}
management:
  health:
    # SMTP and Redis are optional in local/dev and are not run on the dev machine.
    # Disable their health probes so the actuator health check doesn't log
    # connection-refused warnings for services that aren't expected to be up here.
    mail:
      enabled: false
    redis:
      enabled: false
com:
  pcpl:
    carbon:
      # All values are supplied by the project-root .env (kept out of git), so this file
      # carries no credentials/environment values and is safe to commit.
      issuerUrl: ${AUTH_ISSUER_URL:http://localhost:${server.port}}
      webPageUrl: ${SRL_WEB_PAGE_URL:https://www.prapticonsulting.com}
      cssPath: ${AUTH_RES_CSS_PATH:file:///@project.basedir@/res/static/css/}
      imagesPath: ${AUTH_RES_IMAGE_PATH:file:///@project.basedir@/res/static/images/}
      jsPath: ${AUTH_RES_JS_PATH:file:///@project.basedir@/res/static/js/}
      library: ${AUTH_RES_LIBRARY_PATH:file:///@project.basedir@/res/static/library/}
      bowerPath: ${AUTH_RES_BOWER_PATH:file:///@project.basedir@/res/static/bower_components}
      homeUrl: ${SRL_HOME_URL:https://srl-dev-dashboard.prapticonsulting.com}
      loginRedirectURL: ${SRL_LOGIN_REDIRECT_URL:https://srl-dev-dashboard.prapticonsulting.com}
      seoNoIndex: true
      appBaseUrl: ${APP_BASE_URL}
      playMobilBaseUrl: ${PLAY_MOBIL_HOME_URL}
      accessTokenUrl: ${ACCESS_TOKEN_URL}
      ssoClientId: ${SSO_CLIENT_ID}
      oauthClientId: ${OAUTH_CLIENT_ID}
      oauthClientSecret: ${OAUTH_CLIENT_SECRET}
      oauthGrantType: ${OAUTH_GRANT_TYPE}
      application: ${APPLICATION}
      channel: ${CHANNEL}
      issuerId: ${IOS_ISSUER_ID}
      keyId: ${IOS_KEY_ID}
      appId: ${IOS_APP_ID}
      playstoreJsonFilePath: ${PLAYSTORE_JSON_FILE_PATH}
      vendorNumber: ${VENDOR_NUMBER}
      fileUploadPath: ${FILE_UPLOAD_PATH}
      mailFromEmailId: ${MAIL_FROM_EMAIL_ID}
      mail-client-type: ${MAIL_CLIENT_TYPE}   # 1 for Sendgrid, 2 for SMTP
      baseTokenURL: ${BASE_TOKEN_URL}
      clientTokenUrl: ${CLIENT_TOKEN_URL}
      assignOfferURL: ${ASSIGN_OFFER_URL}
      exchangeAccessCodeURL: ${EXCHANGE_ACCESS_CODE_URL}
      userTokenURL: ${USER_TOKEN_URL}

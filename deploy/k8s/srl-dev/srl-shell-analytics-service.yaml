apiVersion: apps/v1
kind: Deployment
metadata:
  name: srl-shell-analytics-service
  labels:
    app: srl-shell-analytics-service
    client: carbon
    type: srl-backend-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: srl-shell-analytics-service
  # Replace in place: no surge pod, so the over-committed nonprod pool never has to
  # fit an extra pod next to srl-playmobil-service.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: srl-shell-analytics-service
    spec:
      nodeSelector:
        doks.digitalocean.com/node-pool: nonprod
      imagePullSecrets:
        - name: pete-container-registry
      containers:
        - name: srl-shell-analytics-service
          image: prasannapete/srl-shell-analytics-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9203
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=65.0 -XX:+ExitOnOutOfMemoryError
            # carbon-modernized property names that differ from the shared srl-config-map
            # keys. Mapped here so srl-config-map (also read by srl-playmobil-service)
            # is never edited.
            - name: MAIL_USERNAME
              valueFrom: {configMapKeyRef: {name: srl-config-map, key: MAIL_USER_NAME}}
            - name: SENDGRID_API_KEY
              valueFrom: {configMapKeyRef: {name: srl-config-map, key: SEND_GRID_KEY}}
            - name: MAIL_FROM_EMAIL_ID
              valueFrom: {configMapKeyRef: {name: srl-config-map, key: SRL_MAIL_FROM_EMAIL_ID}}
            - name: ACCESS_TOKEN_URL
              valueFrom: {configMapKeyRef: {name: srl-config-map, key: ACCESS_TOKEN_URI}}
            - name: CLIENT_TOKEN_URL
              valueFrom: {configMapKeyRef: {name: srl-config-map, key: Client_TOKEN_URL}}
          envFrom:
            - configMapRef:
                name: srl-config-map
            - configMapRef:
                name: carbon-modernized-config
          resources:
            requests:
              cpu: 20m
              memory: 640Mi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket: {port: 9203}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: 9203}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: 9203}
            periodSeconds: 20
            failureThreshold: 6

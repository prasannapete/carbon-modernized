# Settings the carbon-modernized backends need that srl-config-map doesn't have.
# Non-secret only. Loaded after srl-config-map, so a key here wins over the shared one.
apiVersion: v1
kind: ConfigMap
metadata:
  name: carbon-modernized-config
data:
  # Links in shell-analytics emails
  APP_BASE_URL: https://srl-dev-dashboard.prapticonsulting.com
  PLAY_MOBIL_HOME_URL: ""
  # 1 = SendGrid, 2 = SMTP (MAIL_HOST/MAIL_* in srl-config-map)
  MAIL_CLIENT_TYPE: "2"
  # Play Store service-account JSON; not mounted in srl-dev yet, so Play Store
  # report fetching in shell-analytics is unavailable there.
  PLAYSTORE_JSON_FILE_PATH: ""
  # Where the authserver sends a logout without an allowed ?redirect= (the dashboard's
  # logout). The dashboard has no token then, so it starts a fresh authorization request
  # and shows the login page. Overrides srl-config-map's http://localhost:3000.
  SRL_LOGIN_REDIRECT_URL: https://srl-dev-dashboard.prapticonsulting.com
  # Browser origins allowed to call the authserver (CORS + post-logout redirect
  # allowlist) and shell-analytics (CORS). Deployed dev frontends (srl-dev-dashboard,
  # leaderboard), local dev servers (dashboard :3000, playMobil :3001,
  # leaderboard-web :3002, http and https) and the existing prod frontends.
  # Keep identical to the cors-allow-origin annotation on srl-dev's
  # srl-api-ingress and srl-auth-server-np-ingress, which answer the preflights.
  AUTH_ALLOWED_ORIGINS: "http://localhost:3000,https://localhost:3000,http://localhost:3001,https://localhost:3001,http://localhost:3002,https://localhost:3002,https://srl-dev-api.prapticonsulting.com,https://srl-dev-dashboard.prapticonsulting.com,https://leaderboard.prapticonsulting.com,https://srl-dashboard.carbon12011ar.com,http://playmobil.carbon12011ar.com,https://playmobil.carbon12011ar.com"
